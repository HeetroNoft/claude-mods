<head>

<title>The Office</title>
<link rel="icon" id="favicon" type="image/png">
<link rel="stylesheet" href="office.css">
</head>
<body>
<div id="stage">
  <canvas id="world" width="320" height="180"></canvas>
  <canvas id="ov"></canvas>
  <div id="card" role="dialog" aria-label="Session"></div>
  <div id="plan" role="dialog" aria-label="Plan"></div>
  <div id="usage"><canvas id="gcv" width="60" height="18" role="img" aria-label="Usage left"></canvas><button id="gtab" type="button" aria-label="Show or hide the usage gauge"><canvas id="gtcv" width="7" height="12"></canvas></button><div id="gtip"></div></div>
  <button id="set" type="button" aria-label="Settings" aria-expanded="false" data-tip="Settings · S"></button>
  <div id="prefs" role="dialog" aria-label="Settings"></div>
  <div id="items" role="toolbar" aria-label="Items to give"></div>
  <div id="floors" role="toolbar" aria-label="Floors"></div>
</div>
<div id="ghost" aria-hidden="true"></div>
